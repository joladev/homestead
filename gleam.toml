name = "homestead"
version = "1.0.0"
target = "javascript"

# Fill out these fields if you intend to generate HTML documentation or publish
# your project to the Hex package manager.
#
# description = ""
# licences = ["Apache-2.0"]
# repository = { type = "github", user = "", repo = "" }
# links = [{ title = "Website", href = "" }]
#
# For a full reference of all the available options, you can have a look at
# https://gleam.run/writing-gleam/gleam-toml/.

[dependencies]
at = { git = "https://tangled.org/hayleigh.dev/at", ref = "cef3259a7bd70c52dbe7ffec484ba180bbd8abbb" }
gleam_http = ">= 4.5.0 and < 5.0.0"
gleam_javascript = ">= 1.0.1 and < 2.0.0"
gleam_json = ">= 3.1.0 and < 4.0.0"
gleam_stdlib = ">= 1.0.0 and < 2.0.0"
gleam_time = ">= 1.11.0 and < 2.0.0"
lustre = ">= 5.7.1 and < 6.0.0"
modem = ">= 2.1.3 and < 3.0.0"
rsvp = ">= 2.0.0 and < 3.0.0"

[dev_dependencies]
gleeunit = ">= 1.0.0 and < 2.0.0"
lustre_dev_tools = { git = "https://github.com/lustre-labs/dev-tools", ref = "0b78fe48d1fab2f49435167141a5d8e7ff96e24a" }

[tools.lustre.dev]
entry = "homestead_dev"
host = "127.0.0.1"
watch = ["content"]

[tools.lustre.html]
title = "Homestead"

[[tools.lustre.html.links]]
rel = "icon"
href = "/favicon.ico"
sizes = "32x32"

[[tools.lustre.html.links]]
rel = "icon"
href = "/favicon.svg"
type = "image/svg+xml"

[[tools.lustre.html.stylesheets]]
href = "/homestead.css"
